<style>
  body { margin: 0; min-height: 100vh; display: flex; justify-content: center; align-items: center; background: #1a1a1a; }
  .gift { position: relative; max-width: 100%; }
  video { display: block; max-width: 100%; height: auto; max-height: 100vh; aspect-ratio: 3 / 4; }
  #sound { position: absolute; top: 12px; right: 12px; padding: 8px 14px; border: 0; border-radius: 999px; background: rgba(0,0,0,.6); color: #fff; font: 600 15px system-ui, sans-serif; cursor: pointer; }
</style>
</head>
<body>
  <div class="gift">
    <video id="v" src="videos/processed/bhai-tika.mp4" poster="images/processed/bhai-tika-poster.jpg" autoplay muted loop playsinline preload="auto"
           aria-label="Happy Bhai Tika, Didi / Baini!"></video>
    <button id="sound" type="button">🔊 Tap for sound</button>
  </div>
  <script>
    const v = document.getElementById('v'), b = document.getElementById('sound');
    function toggle() {
      v.muted = !v.muted;
      if (!v.muted) { v.currentTime = 0; v.play().catch(() => {}); }
      b.textContent = v.muted ? '🔊 Tap for sound' : '🔇 Mute';
    }
    b.onclick = toggle;
    v.onclick = toggle;
  </script>
</body>
